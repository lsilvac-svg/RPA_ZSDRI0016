{% extends "base.html" %}
{% block titulo %}Eliminar{% endblock %}
{% block contenido %}
<h1 class="h3 mb-4">Eliminar</h1>
<div class="card shadow-sm border-danger">
  <div class="card-body">
    <p>¿Seguro que desea eliminar <strong>{{ object }}</strong>? Esta acción no se puede deshacer.</p>
    <form method="post">
      {% csrf_token %}
      <button class="btn btn-danger"><i class="bi bi-trash"></i> Eliminar</button>
      <a href="{{ volver }}" class="btn btn-link">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
