{% extends "base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block contenido %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h1 class="h3 mb-0">{{ titulo }}</h1>
  <a href="{{ volver }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Volver</a>
</div>
<div class="card shadow-sm">
  <div class="card-body">
    <form method="post" novalidate>
      {% csrf_token %}
      {% include "includes/campos.html" %}
      <div class="mt-4">
        <button class="btn btn-primary"><i class="bi bi-check-lg"></i> Guardar</button>
        <a href="{{ volver }}" class="btn btn-link">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
