{% extends "base.html" %}
{% block titulo %}Cambiar contraseña{% endblock %}
{% block contenido %}
<h1 class="h3 mb-4">Cambiar contraseña</h1>
<div class="card shadow-sm" style="max-width: 520px">
  <div class="card-body">
    <form method="post" novalidate>
      {% csrf_token %}
      {% include "includes/campos.html" with columnas="col-12" %}
      <button class="btn btn-primary mt-4"><i class="bi bi-key"></i> Cambiar contraseña</button>
    </form>
  </div>
</div>
{% endblock %}
