{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block cuerpo %}
<div class="login-fondo d-flex align-items-center justify-content-center p-3">
  <div class="card shadow-lg" style="max-width: 400px; width: 100%">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <i class="bi bi-robot display-5 text-primary"></i>
        <h1 class="h4 mt-2 mb-0">RPAs SAP</h1>
        <div class="text-muted small">IPESA</div>
      </div>
      <form method="post" novalidate>
        {% csrf_token %}
        {% include "includes/campos.html" with columnas="col-12" %}
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn-primary w-100 mt-4"><i class="bi bi-box-arrow-in-right"></i> Ingresar</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
