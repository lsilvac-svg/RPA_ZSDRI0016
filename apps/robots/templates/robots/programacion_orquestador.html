{% extends "base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block contenido %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h1 class="h3 mb-0"><i class="bi bi-diagram-3"></i> {{ titulo }}</h1>
  <a href="{{ volver }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Volver</a>
</div>
<form method="post" novalidate>
  {% csrf_token %}
  <div class="card shadow-sm mb-4">
    <div class="card-body">{% include "includes/campos.html" %}</div>
  </div>
  <div class="card shadow-sm mb-4">
    <div class="card-header bg-white fw-semibold"><i class="bi bi-list-ol"></i> Robots que se ejecutarán</div>
    <div class="card-body" id="pasos-orquestador">{% include "robots/_pasos_orquestador.html" %}</div>
  </div>
  <button class="btn btn-primary"><i class="bi bi-check-lg"></i> Guardar</button>
  <a href="{{ volver }}" class="btn btn-link">Cancelar</a>
</form>
{% endblock %}
