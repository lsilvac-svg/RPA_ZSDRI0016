# Instancia Docker: interfaz web + PostgreSQL.
# El worker corre en Windows (scripts\iniciar_worker.bat) y se conecta a
# esta misma base por localhost:5432.
name: rpa-sap

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-rpa_sap}
      POSTGRES_USER: ${DB_USER:-rpa_sap}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # solo para el worker de este equipo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    image: rpa-sap-web
    restart: unless-stopped
    env_file: .env
    environment:
      DB_ENGINE: postgres
      DB_HOST: db
      DB_PORT: "5432"
    ports:
      - "8030:8030"
    volumes:
      # Capturas de error que guarda el worker de Windows
      - ./media:/app/media
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
